<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question for Chiku</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="content-wrapper" id="main-content">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmZnZndiZnBjOW50Y2Y2NmY4emY5a2Y5a2Y5a2Y5a2Y5a2Y5YSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9Ibxx54XRzsXdDk/giphy.gif" alt="Cute Cat" class="cute-image">
            <h1>Chiku, will you be my valentine?</h1>
            <div class="buttons">
                <button id="yesBtn">Yes</button>
                <button id="noBtn">No</button>
            </div>
             <p class="shy-text">"No" seems a bit shy...</p>
        </div>

        <div class="success-message" id="success-message" style="display: none;">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmZnZndiZnBjOW50Y2Y2NmY4emY5a2Y5a2Y5a2Y5a2Y5a2Y5YSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9Ibxx54XRzsXdDk/giphy.gif" alt="Happy Cat" class="cute-image icon-heart">
            <h1>YAY!</h1>
            <h2>I love you Chiku ❤️</h2>
        </div>
    </div>
    
    <div class="hearts-container" id="hearts-container"></div>

    <script src="script.js"></script>
</body>

</html>
